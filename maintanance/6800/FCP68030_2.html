<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F-CP-68030 บันทึกการบำรุงรักษา cobas 6800</title>
<style>
:root{
  --blue:#1a73e8;--blue-dark:#1557b0;--blue-light:#e8f0fe;
  --green:#34a853;--green-light:#e6f4ea;
  --gold:#f9ab00;--gold-light:#fef7e0;
  --red:#ea4335;
  --gray:#5f6368;--gray-light:#f8f9fa;--border:#dadce0;
  --text:#202124;--text2:#5f6368;
  --radius:8px;--shadow:0 1px 6px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun','Tahoma',sans-serif;font-size:14px;background:#f0f2f5;color:var(--text);min-height:100vh}

/* TOP BAR */
.topbar{background:var(--blue);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-logo{font-size:20px}
.topbar-title{font-size:15px;font-weight:700;line-height:1.2}
.topbar-sub{font-size:11px;opacity:.8}
.topbar-actions{display:flex;gap:8px}
.btn{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.btn-white{background:#fff;color:var(--blue)}.btn-white:hover{background:#e8f0fe}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#2d9248}
.btn-outline{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}.btn-outline:hover{background:rgba(255,255,255,.12)}
.btn-sm{padding:4px 10px;font-size:12px}

/* MONTH NAV */
.month-nav{background:#fff;border-bottom:1px solid var(--border);padding:0 8px;display:flex;align-items:center;gap:0;overflow-x:auto;position:sticky;top:52px;z-index:150}
.month-nav::-webkit-scrollbar{height:3px}.month-nav::-webkit-scrollbar-thumb{background:var(--border)}
.month-tab{padding:10px 16px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--gray);white-space:nowrap;border-bottom:2px solid transparent;transition:.15s;flex-shrink:0}
.month-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.month-tab:hover:not(.active){color:var(--text);background:var(--gray-light)}
.month-add-btn{padding:6px 12px;border:1px dashed #aaa;border-radius:6px;background:#f8f9fa;color:var(--gray);cursor:pointer;font-size:12px;font-weight:600;margin:6px 8px;white-space:nowrap;flex-shrink:0}
.month-add-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-light)}

/* PAGE WRAP */
.page-wrap{padding:14px;max-width:100%}

/* SHEET HEADER */
.sheet-header{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 20px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.sheet-header h2{font-size:15px;font-weight:700;color:var(--blue);flex:1 0 180px}
.sheet-field{display:flex;align-items:center;gap:8px;font-size:13px}
.sheet-field label{font-weight:600;white-space:nowrap;color:var(--text2)}
.sheet-field input{border:none;border-bottom:1.5px solid var(--border);padding:2px 6px;font-size:13px;min-width:130px;outline:none;font-family:inherit}
.sheet-field input:focus{border-bottom-color:var(--blue)}
.badge-month{background:var(--blue-light);color:var(--blue);font-weight:700;padding:4px 12px;border-radius:99px;font-size:13px}

/* TABLE */
.table-scroll{overflow-x:auto;border-radius:var(--radius);box-shadow:var(--shadow)}
.maint-table{border-collapse:collapse;background:#fff}
.maint-table th,.maint-table td{border:1px solid #c8d0da;padding:0;font-size:12px;vertical-align:middle;white-space:nowrap}

/* sticky task column */
.maint-table.col-task{position:sticky;left:0;z-index:10;background:#fff;width:250px;min-width:200px;max-width:270px;padding:5px 8px;font-size:12px;line-height:1.4;white-space:normal}
thead th.col-task{background:#1a3c6e;color:#fff;font-weight:700;font-size:13px;text-align:center;padding:8px;z-index:11}

/* row types */
.row-section td{background:#1a3c6e!important;color:#fff;font-weight:700;font-size:12px;padding:5px 8px}
.row-section .col-task{background:#1a3c6e!important;color:#fff;z-index:10}
.row-subsection td{background:#2b5299!important;color:#fff;font-weight:600;font-size:11px;padding:4px 8px}
.row-subsection .col-task{background:#2b5299!important;color:#fff;z-index:10}

/* day cells */
.col-day{width:30px;min-width:28px;text-align:center;cursor:pointer;padding:6px 2px;transition:.12s;font-size:13px}
.col-day:hover{background:#d2e3fc!important}
.col-day.off{background:#efefef!important;cursor:default;color:#ccc!important}
.col-day.done{background:#ceead6!important;color:#137333;font-weight:700}
thead th.col-day{background:#1a3c6e;color:#fff;font-size:11px;padding:6px 2px;cursor:default}
thead th.col-day:hover{background:#1a3c6e!important}
thead th.col-day.off{background:#2d4a7a!important;color:#8ab!important}

/* perform by row */
.row-perform td{background:#fef7e0;padding:0}
.row-perform .col-task{background:#fef7e0;font-weight:700;color:#7a5800;padding:5px 8px}
.sig-cell{width:30px;height:44px;text-align:center;cursor:pointer;vertical-align:middle}
.sig-cell .sig-placeholder{font-size:16px;color:#ccc;line-height:44px;display:block}
.sig-cell canvas{display:block;width:28px;height:42px;border:1px solid #bbb}
.sig-cell.off{cursor:default;background:#efefef}
.sig-cell.off .sig-placeholder{display:none}

/* notes */
.notes-section{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-top:12px;padding:16px}
.notes-section h3{font-size:14px;font-weight:700;color:var(--blue);margin-bottom:10px}
.notes-table{width:100%;border-collapse:collapse}
.notes-table th,.notes-table td{border:1px solid var(--border);padding:6px 10px;font-size:13px}
.notes-table th{background:var(--blue-light);color:var(--blue);font-weight:700;text-align:center}
.notes-table td:first-child{text-align:center;width:40px;color:var(--text2);font-weight:600}
.notes-table input{width:100%;border:none;outline:none;font-size:13px;font-family:inherit;background:transparent}
.add-note-btn{margin-top:8px;background:var(--blue-light);color:var(--blue);border:1px dashed var(--blue);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:600}
.add-note-btn:hover{background:#c5d9fc}

/* setup panel */
.setup-panel{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.setup-panel summary{font-weight:700;color:var(--blue);cursor:pointer;font-size:13px}
.setup-body{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.setup-field{display:flex;align-items:center;gap:10px}
.setup-field label{font-size:13px;font-weight:600;color:var(--text2);min-width:90px}
.setup-field input{flex:1;border:1.5px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;outline:none;font-family:inherit}
.setup-field input:focus{border-color:var(--blue)}
.gs-status{font-size:12px;padding-top:2px}
.gs-ok{color:var(--green)}.gs-err{color:var(--red)}
pre.gs-code{display:none}

/* modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:20px;width:340px;max-width:95vw;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.modal h3{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--blue)}
#sigCanvas{border:2px solid var(--border);border-radius:6px;cursor:crosshair;display:block;width:100%;touch-action:none}
.modal-actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.btn-clear{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn-clear:hover{background:#fce8e6}
.btn-cancel{background:#f0f0f0;color:var(--text)}.btn-cancel:hover{background:#e0e0e0}

/* toast */
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%) translateY(30px);background:#303030;color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;opacity:0;transition:.3s;z-index:9999;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* status bar */
.status-bar{background:#fff;border-top:1px solid var(--border);padding:6px 16px;font-size:12px;color:var(--text2);display:flex;gap:16px;position:sticky;bottom:0;z-index:100}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
.dot-green{background:var(--green)}.dot-gold{background:var(--gold)}.dot-blue{background:var(--blue)}.dot-red{background:var(--red)}
.nav-inline{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nav-inline .btn{padding:6px 12px;font-size:12px}

@media print{
  .topbar,.month-nav,.setup-panel,.status-bar,.modal-bg,.toast,.btn,.add-note-btn{display:none!important}
  .page-wrap{padding:0}
  .table-scroll{box-shadow:none;overflow:visible}
  .col-task{position:static!important}
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-logo">🔧</span>
    <div>
      <div class="topbar-title">F-CP-68030 — บันทึกการบำรุงรักษา cobas 6800</div>
      <div class="topbar-sub">กลุ่มงานเทคนิคการแพทย์ ร.พ.พระจอมเกล้า เพชรบุรี</div>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="btn btn-outline" onclick="goToDashboard()">🏠 Dashboard</button>
    <button class="btn btn-outline" onclick="goBackPage()">← กลับ</button>
    <button class="btn btn-white" onclick="exportJSON()">💾 Export JSON</button>
    <button class="btn btn-outline" onclick="downloadGs()">📥 ดาวน์โหลด Apps Script</button>
    <button class="btn btn-green" onclick="submitToSheets()">📤 บันทึก Google Drive/Sheets</button>
    <button class="btn btn-outline" onclick="window.print()">🖨 พิมพ์</button>
  </div>
</div>

<!-- MONTH NAVIGATION -->
<div class="month-nav" id="monthNav">
  <div id="monthTabs" style="display:flex"></div>
  <button class="month-add-btn" onclick="addNextMonth()">+ เดือนถัดไป</button>
</div>

<!-- MAIN -->
<div class="page-wrap">

  <!-- hidden status only -->
  <div id="gsStatus" class="gs-status" style="display:none"></div>

  <!-- SHEET HEADER -->
  <div class="sheet-header">
    <div style="flex:1 0 180px">
      <h2>แบบบันทึกตารางการบำรุงรักษาเครื่อง cobas 6800 V2.0 system</h2>
      <div class="nav-inline">
        <button class="btn btn-outline" onclick="goToDashboard()">🏠 กลับหน้า Dashboard</button>
        <button class="btn btn-outline" onclick="goBackPage()">← กลับหน้าก่อนหน้า</button>
      </div>
    </div>
    <div class="sheet-field">
      <label>Serial No.</label>
      <input type="text" id="serialNo" placeholder="กรอก Serial No." oninput="saveCurrentSerial()">
    </div>
    <div class="badge-month" id="badgeMonth">—</div>
    <span style="font-size:11px;color:var(--text2)">F-CP-68030</span>
  </div>

  <!-- TABLE -->
  <div class="table-scroll" id="tableWrap"></div>

  <!-- NOTES -->
  <div class="notes-section">
    <h3>📝 Additional Note</h3>
    <table class="notes-table">
      <thead><tr><th style="width:40px">#</th><th>บันทึกเพิ่มเติม</th></tr></thead>
      <tbody id="notesTbody"></tbody>
    </table>
    <button class="add-note-btn" onclick="addNote()">+ เพิ่มบรรทัด</button>
  </div>

</div>

<!-- STATUS BAR -->
<div class="status-bar">
  <span id="sbDone"><span class="dot dot-green"></span>ทำแล้ว: <b id="cntDone">0</b></span>
  <span id="sbPending"><span class="dot dot-gold"></span>ยังไม่ทำ: <b id="cntPending">0</b></span>
  <span id="sbCloud" style="font-size:11px"></span>
  <span id="sbSync" style="margin-left:auto;font-size:11px"></span>
  <span style="font-size:11px" id="sbSaved"></span>
</div>

<!-- SIGNATURE MODAL -->
<div class="modal-bg" id="sigModalBg">
  <div class="modal">
    <h3 id="sigTitle">✍️ ลายเซ็น Perform by</h3>
    <canvas id="sigCanvas" width="300" height="120"></canvas>
    <div class="modal-actions">
      <button class="btn btn-clear" onclick="clearSig()">ล้าง</button>
      <button class="btn btn-cancel" onclick="closeSig()">ยกเลิก</button>
      <button class="btn btn-green" onclick="saveSig()">บันทึก ✓</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── THAI CALENDAR ─────────────────────────────────────────
const TH_LONG  = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                  'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.',
                  'ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function thaiLong(y, m)  { return TH_LONG[m-1]  + ' ' + (y+543); }
function thaiShort(y, m) { return TH_SHORT[m-1] + ' ' + (y+543); }
function daysIn(y, m)    { return new Date(y, m, 0).getDate(); }
function goToDashboard() { window.location.href = '../../index.html'; }
function goBackPage() {
  if (document.referrer && document.referrer !== window.location.href) {
    window.history.back();
  } else {
    window.location.href = '../maintenance.html';
  }
}

// ── TASKS ────────────────────────────────────────────────
const TASKS = [
  {key:'_daily',  label:'Daily',                                                         type:'section'},
  {key:'_sod',    label:'START OF DAY :',                                                type:'sub'},
  {key:'sod1',    label:'- Replace and load consumable, reagent and control',            type:'task'},
  {key:'_eod',    label:'END OF DAY :',                                                  type:'sub'},
  {key:'eod1',    label:'- Empty the liquid waste, solid waste and replace wash reagent',type:'task'},
  {key:'eod2',    label:'- Replace specimen diluent and lysis',                          type:'task'},
  {key:'eod3',    label:'- (Optional) Unload reagent and control before shutdown system',type:'task'},
  {key:'eod4',    label:'- (Optional) Turn Off Sample Supply Module',                   type:'task'},
  {key:'_weekly', label:'Clean instrument (weekly)',                                     type:'section'},
  {key:'_cleanH', label:'Clean part of instrument with DW following by 70%EtOH',        type:'sub'},
  {key:'cl1',     label:'- Transfer module drawer and Processing module drawer',         type:'task'},
  {key:'cl2',     label:'- Lysis / diluent drawer',                                     type:'task'},
  {key:'cl3',     label:'- Wash / waste drawer',                                        type:'task'},
  {key:'cl4',     label:'- Amplification plate waste drawer',                           type:'task'},
  {key:'cl5',     label:'- Transfer module and Processing module',                      type:'task'},
  {key:'cl6',     label:'- Sample supply module',                                       type:'task'},
  {key:'cl7',     label:'- (Optional) All cover and doors',                             type:'task'},
  {key:'_tight',  label:'Sample transfer head teaching and tightness check (weekly)',   type:'section'},
  {key:'tg1',     label:'- Click to perform Tightness check at the software',           type:'task'},
];
const TASK_ROWS = TASKS.filter(t => t.type==='task');

// ── STATE ────────────────────────────────────────────────
let months = [];    // [{year, month}]
let curIdx  = 0;
let sigDay  = null;
let sigMk   = null;
let drawing = false;
let sCtx    = null;

function mk(y, m) { return 'fcp_' + y + '_' + String(m).padStart(2,'0'); }
function getD(k)  { try { return JSON.parse(localStorage.getItem(k) || 'null') || {serial:'',checks:{},sigs:{},notes:[]}; } catch(e) { return {serial:'',checks:{},sigs:{},notes:[]}; } }
function setD(k, d){ localStorage.setItem(k, JSON.stringify(d)); }

// ── MONTHS ───────────────────────────────────────────────
function initMonths() {
  const s = localStorage.getItem('fcp_months');
  try { months = s ? JSON.parse(s) : [{year:2026, month:8}]; }
  catch(e) { months = [{year:2026, month:8}]; }
  if (!Array.isArray(months)) months = [];
  months = months.filter(x => x && Number.isInteger(x.year) && Number.isInteger(x.month) && x.month >= 1 && x.month <= 12);
  months = [...new Map(months.map(x => [x.year * 12 + x.month, x])).values()]
    .sort((a,b) => a.year - b.year || a.month - b.month);
  if (!months.length) months = [{year:2026, month:8}];
  const now = new Date();
  const currentMonth = {year:now.getFullYear(), month:now.getMonth()+1};
  const hadCurrentMonth = months.some(x => x.year === currentMonth.year && x.month === currentMonth.month);
  const currentValue = now.getFullYear() * 12 + now.getMonth() + 1;
  let last = months[months.length - 1];
  let lastValue = last.year * 12 + last.month;
  while (lastValue < currentValue && months.length < 240) {
    lastValue++;
    months.push({year:Math.floor((lastValue - 1) / 12), month:(lastValue - 1) % 12 + 1});
  }
  saveMList();
  // จำเดือนที่เปิดอยู่ล่าสุด; ถ้าไม่มีให้ใช้เดือนปัจจุบัน; ถ้าไม่มีอีกใช้เดือนล่าสุดในรายการ
  let i = -1;
  if (!hadCurrentMonth) i = months.findIndex(x => x.year === currentMonth.year && x.month === currentMonth.month);
  try { if (i < 0) { const c = JSON.parse(localStorage.getItem('fcp_cur') || 'null'); if (c) i = months.findIndex(x=>x.year===c.year&&x.month===c.month); } } catch(e){}
  if (i < 0) { const n = new Date(); i = months.findIndex(x=>x.year===n.getFullYear()&&x.month===n.getMonth()+1); }
  curIdx = i >= 0 ? i : months.length-1;
}
function saveCur() { try { localStorage.setItem('fcp_cur', JSON.stringify(months[curIdx])); } catch(e){} }
function saveMList() { localStorage.setItem('fcp_months', JSON.stringify(months)); }

function addNextMonth() {
  const last = months[months.length-1];
  let ny = last.year, nm = last.month+1;
  if (nm>12){ nm=1; ny++; }
  if (!months.find(x=>x.year===ny&&x.month===nm)){
    months.push({year:ny, month:nm});
    saveMList();
  }
  markCloudDirty('fcp_months');
  curIdx = months.length-1;
  saveCur();
  renderTabs(); renderForm();
}

function renderTabs() {
  const c = document.getElementById('monthTabs');
  c.innerHTML = '';
  months.forEach(({year,month}, i) => {
    const b = document.createElement('button');
    b.className = 'month-tab' + (i===curIdx ? ' active' : '');
    b.textContent = thaiShort(year, month);
    b.onclick = ()=>{ curIdx=i; saveCur(); renderTabs(); renderForm(); };
    c.appendChild(b);
  });
}

// ── RENDER FORM ──────────────────────────────────────────
function renderForm() {
  const {year, month} = months[curIdx];
  const key = mk(year, month);
  const data = getD(key);
  const nDays = daysIn(year, month);

  document.getElementById('badgeMonth').textContent = thaiLong(year, month);
  document.getElementById('serialNo').value = data.serial || '';

  // Build table
  const wrap = document.getElementById('tableWrap');
  const tbl = document.createElement('table');
  tbl.className = 'maint-table';

  // thead
  const thead = document.createElement('thead');
  const trH = document.createElement('tr');
  const thT = document.createElement('th');
  thT.className = 'col-task';
  thT.textContent = 'รายการ / วันที่';
  trH.appendChild(thT);
  for (let d=1; d<=31; d++) {
    const th = document.createElement('th');
    th.className = 'col-day' + (d>nDays ? ' off' : '');
    th.textContent = d;
    trH.appendChild(th);
  }
  thead.appendChild(trH);
  tbl.appendChild(thead);

  // tbody
  const tbody = document.createElement('tbody');

  TASKS.forEach(task => {
    const tr = document.createElement('tr');
    if (task.type==='section') tr.className='row-section';
    if (task.type==='sub')     tr.className='row-subsection';
    const tdT = document.createElement('td');
    tdT.className = 'col-task';
    tdT.textContent = task.label;
    tr.appendChild(tdT);
    for (let d=1; d<=31; d++) {
      const td = document.createElement('td');
      const ck = task.key+'_'+d;
      if (task.type==='task') {
        const off = d>nDays;
        td.className = 'col-day' + (off?' off':'') + (data.checks[ck]?' done':'');
        td.textContent = data.checks[ck] || '';
        if (!off) td.onclick = ()=>toggleCk(td, key, ck);
      } else {
        td.className = 'col-day' + (d>nDays?' off':'');
        td.style.cursor='default';
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });

  // Perform by
  const trP = document.createElement('tr');
  trP.className = 'row-perform';
  const tdPL = document.createElement('td');
  tdPL.className = 'col-task';
  tdPL.innerHTML = '✍️ <strong>Perform by</strong>';
  trP.appendChild(tdPL);
  for (let d=1; d<=31; d++) {
    const td = document.createElement('td');
    const off = d>nDays;
    td.className = 'sig-cell' + (off?' off':'');
    if (!off) {
      if (data.sigs && data.sigs[d]) {
        const cv = document.createElement('canvas');
        cv.width=60; cv.height=84;
        const ctx = cv.getContext('2d');
        const img = new Image();

function bindSig(cv) {
  drawing=false;
  const pos=e=>{ const r=cv.getBoundingClientRect(),s=e.touches?e.touches[0]:e;
    return{x:(s.clientX-r.left)*cv.width/r.width, y:(s.clientY-r.top)*cv.height/r.height}; };
  cv.onmousedown=cv.ontouchstart=e=>{ e.preventDefault(); drawing=true; const p=pos(e); sCtx.beginPath(); sCtx.moveTo(p.x,p.y); };
  cv.onmousemove=cv.ontouchmove=e=>{ if(!drawing)return; e.preventDefault(); const p=pos(e);
    sCtx.lineWidth=2; sCtx.strokeStyle='#1a3c6e'; sCtx.lineCap='round'; sCtx.lineJoin='round';
    sCtx.lineTo(p.x,p.y); sCtx.stroke(); };
  cv.onmouseup=cv.ontouchend=()=>drawing=false;
}

function scheduleCloudSync(key, delay) {

async function syncCloudRecord(key) {
  if (!cloudReady || cloudSyncing[key] || !cloudDirtyKeys.has(key)) return;
  cloudSyncing[key] = true;
  const updatedAt = cloudUpdatedAt[key] || (cloudUpdatedAt[key] = new Date().toISOString());
  localStorage.setItem('fcp_cloud_updated_at', JSON.stringify(cloudUpdatedAt));
  updateCloudIndicator();
  try {
    const data = key === 'fcp_months' ? months : getD(key);
    const response = await fetch(MAINTENANCE_API, {
      method:'POST',
      headers:cloudHeaders(),
      body:JSON.stringify({form:'FCP68030_2', key, data, updatedAt}),
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok || !result.ok) throw new Error(result.error || 'Cloudflare save failed');
    if (!result.saved) {
      if (!result.current) throw new Error('Cloudflare record is missing');
      if (cloudUpdatedAt[key] !== updatedAt) {
        scheduleCloudSync(key, 100);
        return;
      }
      if (key === 'fcp_months') {
        const merged = mergeMonthLists(months, result.current.data);
        const changed = JSON.stringify(merged) !== JSON.stringify(months);
        months = merged;
        localStorage.setItem('fcp_months', JSON.stringify(months));
        curIdx = Math.max(0, months.findIndex(x => x.year === months[curIdx].year && x.month === months[curIdx].month));
        renderTabs();
        renderForm();
        if (changed) {
          markCloudDirty(key);
          return;
        }
      } else {
        localStorage.setItem(key, JSON.stringify(result.current.data));
        if (months[curIdx] && mk(months[curIdx].year, months[curIdx].month) === key) renderForm();
      }
      cloudDirtyKeys.delete(key);
      delete cloudUpdatedAt[key];
      persistCloudDirty();
      localStorage.setItem('fcp_cloud_updated_at', JSON.stringify(cloudUpdatedAt));
      return;
    }
    if (cloudUpdatedAt[key] === updatedAt) {
      cloudDirtyKeys.delete(key);
      delete cloudUpdatedAt[key];
      persistCloudDirty();
      localStorage.setItem('fcp_cloud_updated_at', JSON.stringify(cloudUpdatedAt));
      cloudRetryDelay[key] = 0;
    } else {
      scheduleCloudSync(key, 100);
    }
  } catch(e) {
    cloudDirtyKeys.add(key);
    persistCloudDirty();
    cloudRetryDelay[key] = Math.min((cloudRetryDelay[key] || 5000) * 2, 120000);
    scheduleCloudSync(key, cloudRetryDelay[key]);
  } finally {
    cloudSyncing[key] = false;
    updateCloudIndicator();
  }
}

function mergeMonthLists(...lists) {
  const unique = new Map();
  lists.flatMap(list => Array.isArray(list) ? list : []).forEach(item => {
    if (item && Number.isInteger(item.year) && Number.isInteger(item.month) && item.month >= 1 && item.month <= 12)
      unique.set(item.year * 12 + item.month, {year:item.year, month:item.month});
  });
  return [...unique.values()].sort((a,b) => a.year - b.year || a.month - b.month);
}

    const selectedMonth = months[curIdx];
    const remoteRecords = new Map(result.records.filter(record => record && typeof record.key === 'string').map(record => [record.key, record]));
    const dirty = new Set([...cloudDirtyKeys, ...dirtyKeys]);
    const localMonths = months;
    const remoteMonths = remoteRecords.get('fcp_months')?.data || [];
    months = mergeMonthLists(localMonths, remoteMonths);
    localStorage.setItem('fcp_months', JSON.stringify(months));

    for (const [key, record] of remoteRecords) {
      if (key === 'fcp_months' || dirty.has(key) || !/^fcp_\d{4}_(0[1-9]|1[0-2])$/.test(key)) continue;
      localStorage.setItem(key, JSON.stringify(record.data));

    let selectedIndex = selectedMonth ? months.findIndex(x => x.year === selectedMonth.year && x.month === selectedMonth.month) : -1;

    checks:      d.checks,

  };
}

async function syncKey(key, opts) {
  opts = opts || {};
  if (syncing[key]) return;
  syncing[key] = true;
  updateSyncIndicator();

  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);

  try {
    const r = await fetch(SHEETS_URL, {
      method:  'POST',
      // text/plain กัน CORS preflight (OPTIONS) ซึ่ง Apps Script ไม่รองรับ —
      // ฝั่ง Apps Script อ่าน e.postData.contents เป็น raw string แล้ว JSON.parse เองอยู่แล้ว ไม่สนใจ header นี้
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body:    JSON.stringify(buildPayload(key)),
      signal:  ctrl.signal
    });
    clearTimeout(timer);

    // Apps Script อาจ return text ก่อน — parse ปลอดภัยกว่า
    const text = await r.text();
    let j;
    try { j = JSON.parse(text); }
    catch(pe) { throw new Error('ตอบกลับไม่ใช่ JSON: ' + text.slice(0,120)); }
    if (j.status !== 'ok') throw new Error(j.message || 'Apps Script ตอบว่า error');

    dirtyKeys.delete(key); persistDirty(); retryDelay[key] = 0;
    if (opts.manual) {
      showToast('✅ บันทึกลง Google Drive/Sheets สำเร็จ!', 4000);
      const gsStatus = document.getElementById('gsStatus');
      gsStatus.innerHTML = '<span class="gs-ok">✅ ส่งสำเร็จ — sheet: <b>' + j.sheet + '</b> (' + new Date().toLocaleTimeString('th-TH') + ')</span>';
    }
  } catch(err) {
    clearTimeout(timer);
    let msg = err.message;
    if (err.name === 'AbortError') msg = 'หมดเวลา 30 วิ — Apps Script ไม่ตอบสนอง';
    if (msg.includes('Failed to fetch') || msg.includes('NetworkError')) {
      msg = 'เชื่อมต่อ Apps Script ไม่ได้ (ออฟไลน์ หรือ URL/Deploy มีปัญหา)';
    }
    dirtyKeys.add(key); persistDirty();
    retryDelay[key] = Math.min((retryDelay[key] || 15000) * 2, 120000);
    scheduleSync(key, retryDelay[key]);
    if (opts.manual) {
      exportJSON();
      showToast('⚠️ ส่งไป Google Drive ไม่สำเร็จ แต่ข้อมูลปลอดภัยในเครื่องนี้ — ระบบจะลองใหม่อัตโนมัติ (ได้บันทึกไฟล์ JSON สำรองไว้ด้วย)', 8000);
      const gsStatus = document.getElementById('gsStatus');
      gsStatus.innerHTML = '<span class="gs-err">❌ ' + msg + '<br>📦 ได้บันทึกไฟล์ JSON สำรองไว้แล้วในเครื่อง — จะลองซิงก์ใหม่อัตโนมัติใน ' + Math.round(retryDelay[key]/1000) + ' วิ</span>';
    }
  } finally {
    syncing[key] = false;
    updateSyncIndicator();
  }
}

function flushDirtyBeacon() {
  if (!navigator.sendBeacon) return;
  dirtyKeys.forEach(key => {
    try {
      const blob = new Blob([JSON.stringify(buildPayload(key))], { type: 'text/plain;charset=utf-8' });
      navigator.sendBeacon(SHEETS_URL, blob);

}

    // แถวที่ 3: Header คอลัมน์ รายการ | 1 | 2 | ... | 31
    var headerRow = ['รายการ'];
    for (var d = 1; d <= 31; d++) { headerRow.push(d); }
    sh.getRange(3, 1, 1, 32).setValues([headerRow]);

    // จัดรูปแบบ header
    var headerRange = sh.getRange(3, 1, 1, 32);
    headerRange.setBackground('#1a3c6e');
    headerRange.setFontColor('#ffffff');
    headerRange.setFontWeight('bold');
    headerRange.setHorizontalAlignment('center');

    // แถวข้อมูล tasks
    var tasks = data.tasks;
    var nDays = data.days.length;
    var rowNum = 4;

    for (var i = 0; i < tasks.length; i++) {
      var row = [tasks[i].label];
      for (var d2 = 1; d2 <= 31; d2++) {
        if (d2 <= nDays) {
          row.push(data.checks[tasks[i].key + '_' + d2] || '');
        } else {
          row.push('');  // วันที่ไม่มีในเดือนนั้น
        }
      }
      sh.getRange(rowNum, 1, 1, 32).setValues([row]);

      // เซลล์ที่มี / ทำสีเขียว
      for (var d3 = 1; d3 <= nDays; d3++) {
        if (data.checks[tasks[i].key + '_' + d3] === '/') {
          sh.getRange(rowNum, d3 + 1).setBackground('#ceead6');
        }
      }
      // วันที่เกินเดือนทำสีเทา
      if (nDays < 31) {
        sh.getRange(rowNum, nDays + 2, 1, 31 - nDays).setBackground('#efefef');
      }
      rowNum++;
    }

    // Perform by row (ว่าง + แทรกรูปลายเซ็น)
    var performRow = ['Perform by (ลายเซ็น)'];
    for (var d4 = 1; d4 <= 31; d4++) { performRow.push(''); }
    sh.getRange(rowNum, 1, 1, 32).setValues([performRow]);
    sh.getRange(rowNum, 1, 1, 32).setBackground('#fef7e0');
    sh.getRange(rowNum, 1).setFontWeight('bold');
    sh.setRowHeight(rowNum, 40);

    var sigs = data.sigs || {};
    for (var d5 = 1; d5 <= nDays; d5++) {
      var sigData = sigs[d5];
      if (sigData) {
        try {
          var commaIdx = sigData.indexOf(',');
          var b64 = commaIdx >= 0 ? sigData.substring(commaIdx + 1) : sigData;
          var sigBlob = Utilities.newBlob(Utilities.base64Decode(b64), 'image/png', 'sig_' + d5 + '.png');
          var img = sh.insertImage(sigBlob, d5 + 1, rowNum);
          img.setWidth(26).setHeight(36);
        } catch (imgErr) {
          // ข้ามรูปที่เสีย ไม่ให้กระทบข้อมูลแถวอื่น
        }
      }
    }
    rowNum += 2;

    // Additional Note
    sh.getRange(rowNum, 1).setValue('Additional Note :');
    sh.getRange(rowNum, 1).setFontWeight('bold');
    rowNum++;
    sh.getRange(rowNum, 1, 1, 2).setValues([['#', 'บันทึกเพิ่มเติม']]);
    sh.getRange(rowNum, 1, 1, 2).setBackground('#e8f0fe').setFontWeight('bold');
    rowNum++;

    var notes = data.notes || [];
    for (var k = 0; k < notes.length; k++) {
      if (notes[k].text) {
        sh.getRange(rowNum, 1, 1, 2).setValues([[notes[k].no, notes[k].text]]);
        rowNum++;
      }
    }

    // ปรับความกว้างคอลัมน์
    sh.setColumnWidth(1, 280);
    for (var c = 2; c <= 32; c++) { sh.setColumnWidth(c, 32); }

    return ContentService
      .createTextOutput(JSON.stringify({ status: 'ok', sheet: sheetName }))
      .setMimeType(ContentService.MimeType.JSON);

  } catch (err) {
    return ContentService
      .createTextOutput(JSON.stringify({ status: 'error', message: err.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}`;

function initGsCode() { /* no-op — using download instead */ }

function downloadGs() {
  // สร้างไฟล์ .gs จาก plain text ตรงๆ ไม่ผ่าน HTML encoding
  const blob = new Blob([GS_CODE], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Code.gs';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  showToast('✅ ดาวน์โหลด Code.gs แล้ว — เปิดด้วย Notepad แล้วคัดลอกไปวางใน Apps Script');
}

// ── INIT ─────────────────────────────────────────────────
initMonths();
renderTabs();
renderForm();

// เดือนที่ยังค้างซิงก์จาก session ก่อนหน้า (เช่น ปิดแท็บตอนออฟไลน์) → ลองส่งใหม่
let staggerI = 0;
dirtyKeys.forEach(key => { scheduleSync(key, 1500 + (staggerI++) * 800); });
updateSyncIndicator();
loadCloudRecords();

document.getElementById('sigModalBg').addEventListener('click', function(e){
  if(e.target===this) closeSig();
});
</script>
